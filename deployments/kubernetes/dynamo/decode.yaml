apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  namespace: dynamo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: decode
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: decode-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
      - name: modelserver
        image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
        command:
        - python3
        - -c
        - "import os, sys\nfrom pathlib import Path\nfrom importlib.metadata import\
          \ version\nfrom packaging.version import Version\nrevision, backend, minimum,\
          \ *command = sys.argv[1:]\nmarker = Path('/model/DEPLOYED_REVISION')\nif\
          \ not marker.exists() or marker.read_text().strip() != revision:\n    raise\
          \ SystemExit('Checkpoint revision mismatch: verify /model/DEPLOYED_REVISION\
          \ on BOTH nodes')\nif Version(version(backend)) < Version(minimum):\n  \
          \  raise SystemExit('This model requires ' + backend + ' >= ' + minimum\
          \ + '; select a compatible complete runtime image')\nos.execvp(command[0],\
          \ command)\n"
        - 252a02f921642313abde19b29a723a16602fe25e
        - vllm
        - 0.26.0
        - python3
        - -m
        - dynamo.vllm
        - --model
        - /model
        - --served-model-name
        - nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
        - --tensor-parallel-size
        - '8'
        - --max-model-len
        - '32768'
        - --max-num-seqs
        - '32'
        - --max-num-batched-tokens
        - '8192'
        - --gpu-memory-utilization
        - '0.8'
        - --block-size
        - '64'
        - --kv-cache-dtype
        - fp8
        - --enable-prefix-caching
        - --no-enable-expert-parallel
        - --trust-remote-code
        - --attention-backend
        - FLASHINFER
        - --linear-backend
        - cutlass
        - --moe-backend
        - flashinfer_trtllm
        - --mamba-backend
        - triton
        - --no-enable-flashinfer-autotune
        - --mamba-cache-mode
        - align
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --no-disable-hybrid-kv-cache-manager
        - --async-scheduling
        - --reasoning-parser-plugin
        - /model/ultra_v3_reasoning_parser.py
        - --reasoning-parser
        - nemotron_v3
        - --dyn-tool-call-parser
        - qwen3_coder
        - --dyn-reasoning-parser
        - nemotron3
        - --disaggregation-mode
        - decode
        - --kv-events-config
        - '{"publisher": "zmq", "topic": "kv-events", "endpoint": "tcp://127.0.0.1:5571",
          "enable_kv_cache_events": true}'
        - --kv-transfer-config
        - '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
        env:
        - name: HF_HOME
          value: /runtime/hf
        - name: HF_MODULES_CACHE
          value: /runtime/hf_modules
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: VLLM_CACHE_ROOT
          value: /runtime/vllm
        - name: TRITON_CACHE_DIR
          value: /runtime/triton
        - name: XDG_CACHE_HOME
          value: /runtime/cache
        - name: TORCH_EXTENSIONS_DIR
          value: /runtime/torch_extensions
        - name: PYTHONHASHSEED
          value: '0'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_HOST_IP
          value: <B300_NODE_B_IP>
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          value: <B300_NODE_B_IP>
        - name: VLLM_NIXL_SIDE_CHANNEL_PORT
          value: '5600'
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: '120'
        - name: UCX_NET_DEVICES
          value: mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1
        - name: UCX_TLS
          value: rc_x,rc,cuda_copy,cuda_ipc
        - name: UCX_RNDV_SCHEME
          value: get_zcopy
        - name: UCX_RNDV_THRESH
          value: '0'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: NCCL_IB_DISABLE
          value: '0'
        - name: NIXL_LOG_LEVEL
          value: INFO
        - name: DYN_NAMESPACE
          value: disagg
        - name: DYN_DISCOVERY_BACKEND
          value: etcd
        - name: ETCD_ENDPOINTS
          value: http://<B300_NODE_A_IP>:2379
        - name: DYN_REQUEST_PLANE
          value: tcp
        - name: DYN_EVENT_PLANE
          value: zmq
        - name: DYN_TCP_RPC_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_TCP_RESPONSE_STREAM_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_EVENT_PLANE_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_SYSTEM_PORT
          value: '8081'
        - name: VLLM_ALLREDUCE_USE_SYMM_MEM
          value: '0'
        - name: VLLM_DISABLED_KERNELS
          value: FlashInferFP8ScaledMMLinearKernel
        - name: VLLM_SSM_CONV_STATE_LAYOUT
          value: DS
        - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
          value: '1'
        - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
          value: '0'
        resources:
          requests:
            cpu: '16'
            memory: 256Gi
            nvidia.com/gpu: '8'
          limits:
            nvidia.com/gpu: '8'
            memory: 2Ti
        securityContext:
          runAsUser: 0
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: runtime
          mountPath: /runtime
        - name: shm
          mountPath: /dev/shm
        - name: rdma
          mountPath: /dev/infiniband
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          timeoutSeconds: 5
          periodSeconds: 15
          failureThreshold: 480
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          timeoutSeconds: 5
          periodSeconds: 15
      volumes:
      - name: model
        hostPath:
          path: /data/nemotron-ultra/model
          type: Directory
      - name: runtime
        hostPath:
          path: /data/disagg/runtime/nemotron-ultra/dynamo/vllm/decode
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: rdma
        hostPath:
          path: /dev/infiniband
          type: Directory
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
