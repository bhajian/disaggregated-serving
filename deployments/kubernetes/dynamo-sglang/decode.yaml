apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  namespace: dynamo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: decode
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: decode-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
      - name: modelserver
        image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0
        command:
        - python3
        - -c
        - "import os, sys\nfrom pathlib import Path\nfrom importlib.metadata import\
          \ version\nfrom packaging.version import Version\nrevision, backend, minimum,\
          \ *command = sys.argv[1:]\nmarker = Path('/model/DEPLOYED_REVISION')\nif\
          \ not marker.exists() or marker.read_text().strip() != revision:\n    raise\
          \ SystemExit('Checkpoint revision mismatch: verify /model/DEPLOYED_REVISION\
          \ on BOTH nodes')\nif Version(version(backend)) < Version(minimum):\n  \
          \  raise SystemExit('This model requires ' + backend + ' >= ' + minimum\
          \ + '; select a compatible complete runtime image')\nos.execvp(command[0],\
          \ command)\n"
        - 003f183a92fbe5b9a8325aaa8b2ae797c91dd90f
        - sglang
        - 0.5.16
        - python3
        - -m
        - dynamo.sglang
        - --model-path
        - /model
        - --served-model-name
        - Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
        - --tensor-parallel-size
        - '8'
        - --context-length
        - '32768'
        - --max-running-requests
        - '32'
        - --chunked-prefill-size
        - '8192'
        - --mem-fraction-static
        - '0.8'
        - --page-size
        - '64'
        - --kv-cache-dtype
        - auto
        - --disaggregation-mode
        - decode
        - --disaggregation-transfer-backend
        - nixl
        - --disaggregation-bootstrap-port
        - '8998'
        - --host
        - 0.0.0.0
        - --port
        - '30000'
        - --enable-metrics
        - --disable-piecewise-cuda-graph
        - --dyn-tool-call-parser
        - qwen3_coder
        - --kv-events-config
        - '{"publisher": "zmq", "topic": "kv-events", "endpoint": "tcp://*:5571"}'
        env:
        - name: HF_HOME
          value: /runtime/hf
        - name: HF_MODULES_CACHE
          value: /runtime/hf_modules
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: TRITON_CACHE_DIR
          value: /runtime/triton
        - name: XDG_CACHE_HOME
          value: /runtime/cache
        - name: TORCH_EXTENSIONS_DIR
          value: /runtime/torch_extensions
        - name: PYTHONHASHSEED
          value: '0'
        - name: UCX_NET_DEVICES
          value: mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1
        - name: UCX_TLS
          value: rc_x,rc,cuda_copy,cuda_ipc
        - name: UCX_RNDV_SCHEME
          value: get_zcopy
        - name: UCX_RNDV_THRESH
          value: '0'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: NCCL_IB_DISABLE
          value: '0'
        - name: NIXL_LOG_LEVEL
          value: INFO
        - name: DYN_NAMESPACE
          value: disagg
        - name: DYN_DISCOVERY_BACKEND
          value: etcd
        - name: ETCD_ENDPOINTS
          value: http://<B300_NODE_A_IP>:2379
        - name: DYN_REQUEST_PLANE
          value: tcp
        - name: DYN_EVENT_PLANE
          value: zmq
        - name: DYN_TCP_RPC_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_TCP_RESPONSE_STREAM_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_EVENT_PLANE_HOST
          value: <B300_NODE_B_IP>
        - name: DYN_SYSTEM_PORT
          value: '8081'
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND
          value: UCX
        - name: SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS
          value: '{"ucx_devices": "mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1"}'
        resources:
          requests:
            cpu: '16'
            memory: 256Gi
            nvidia.com/gpu: '8'
          limits:
            nvidia.com/gpu: '8'
            memory: 2Ti
        securityContext:
          runAsUser: 0
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
        volumeMounts:
        - name: model
          mountPath: /model
          readOnly: true
        - name: runtime
          mountPath: /runtime
        - name: shm
          mountPath: /dev/shm
        - name: rdma
          mountPath: /dev/infiniband
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          timeoutSeconds: 5
          periodSeconds: 15
          failureThreshold: 480
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          timeoutSeconds: 5
          periodSeconds: 15
      volumes:
      - name: model
        hostPath:
          path: /data/models/qwen-480b
          type: Directory
      - name: runtime
        hostPath:
          path: /data/disagg/runtime/qwen-480b/dynamo/sglang/decode
          type: DirectoryOrCreate
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: rdma
        hostPath:
          path: /dev/infiniband
          type: Directory
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
