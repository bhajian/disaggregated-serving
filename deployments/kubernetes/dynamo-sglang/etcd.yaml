apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: dynamo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: etcd
  template:
    metadata:
      labels: *id001
    spec:
      nodeSelector:
        kubernetes.io/hostname: prefill-node
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.21
        command:
        - /usr/local/bin/etcd
        - --name=default
        - --data-dir=/etcd-data
        - --listen-client-urls=http://<B300_NODE_A_IP>:2379
        - --advertise-client-urls=http://<B300_NODE_A_IP>:2379
        - --listen-peer-urls=http://127.0.0.1:2380
        - --initial-advertise-peer-urls=http://127.0.0.1:2380
        - --initial-cluster=default=http://127.0.0.1:2380
        volumeMounts:
        - name: etcd
          mountPath: /etcd-data
      volumes:
      - name: etcd
        hostPath:
          path: /data/disagg/etcd
          type: DirectoryOrCreate
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
