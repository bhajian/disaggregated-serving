name: disagg
services:
  decode:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.0@sha256:8401411dc8e968eff9310462102491509e3f93d3ce03d6febc8d5566f067a7b1
    entrypoint:
    - python3
    - -c
    - "import os, sys\nfrom pathlib import Path\nfrom importlib.metadata import version\n\
      from packaging.version import Version\nrevision, backend, minimum, *command\
      \ = sys.argv[1:]\nmarker = Path('/model/DEPLOYED_REVISION')\nif not marker.exists()\
      \ or marker.read_text().strip() != revision:\n    raise SystemExit('Checkpoint\
      \ revision mismatch: verify /model/DEPLOYED_REVISION on BOTH nodes')\nif Version(version(backend))\
      \ < Version(minimum):\n    raise SystemExit('This model requires ' + backend\
      \ + ' >= ' + minimum + '; select a compatible complete runtime image')\nos.execvp(command[0],\
      \ command)\n"
    - 252a02f921642313abde19b29a723a16602fe25e
    - vllm
    - 0.26.0
    - python3
    - -m
    - dynamo.vllm
    - --model
    - /model
    - --served-model-name
    - nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
    - --tensor-parallel-size
    - '8'
    - --max-model-len
    - '32768'
    - --max-num-seqs
    - '32'
    - --max-num-batched-tokens
    - '8192'
    - --gpu-memory-utilization
    - '0.8'
    - --block-size
    - '64'
    - --kv-cache-dtype
    - fp8
    - --enable-prefix-caching
    - --no-enable-expert-parallel
    - --trust-remote-code
    - --attention-backend
    - FLASHINFER
    - --linear-backend
    - cutlass
    - --moe-backend
    - flashinfer_trtllm
    - --mamba-backend
    - triton
    - --no-enable-flashinfer-autotune
    - --mamba-cache-mode
    - align
    - --mamba-ssm-cache-dtype
    - bfloat16
    - --no-disable-hybrid-kv-cache-manager
    - --async-scheduling
    - --reasoning-parser-plugin
    - /model/ultra_v3_reasoning_parser.py
    - --reasoning-parser
    - nemotron_v3
    - --dyn-tool-call-parser
    - qwen3_coder
    - --dyn-reasoning-parser
    - nemotron3
    - --disaggregation-mode
    - decode
    - --kv-events-config
    - '{"publisher": "zmq", "topic": "kv-events", "endpoint": "tcp://127.0.0.1:5571",
      "enable_kv_cache_events": true}'
    - --kv-transfer-config
    - '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
    network_mode: host
    ipc: host
    user: '0'
    gpus: all
    devices:
    - /dev/infiniband:/dev/infiniband
    cap_add:
    - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    environment:
      HF_HOME: /runtime/hf
      HF_MODULES_CACHE: /runtime/hf_modules
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      VLLM_CACHE_ROOT: /runtime/vllm
      TRITON_CACHE_DIR: /runtime/triton
      XDG_CACHE_HOME: /runtime/cache
      TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
      PYTHONHASHSEED: '0'
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_HOST_IP: 10.104.0.7
      VLLM_NIXL_SIDE_CHANNEL_HOST: 10.104.0.7
      VLLM_NIXL_SIDE_CHANNEL_PORT: '5600'
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '120'
      UCX_NET_DEVICES: mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1
      UCX_TLS: rc_x,rc,cuda_copy,cuda_ipc
      UCX_RNDV_SCHEME: get_zcopy
      UCX_RNDV_THRESH: '0'
      NCCL_SOCKET_IFNAME: eth0
      GLOO_SOCKET_IFNAME: eth0
      NCCL_IB_DISABLE: '0'
      NIXL_LOG_LEVEL: INFO
      DYN_NAMESPACE: disagg
      DYN_DISCOVERY_BACKEND: etcd
      ETCD_ENDPOINTS: http://10.104.0.51:2379
      DYN_REQUEST_PLANE: tcp
      DYN_EVENT_PLANE: zmq
      DYN_TCP_RPC_HOST: 10.104.0.7
      DYN_TCP_RESPONSE_STREAM_HOST: 10.104.0.7
      DYN_EVENT_PLANE_HOST: 10.104.0.7
      DYN_SYSTEM_PORT: '8081'
      VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
      VLLM_DISABLED_KERNELS: FlashInferFP8ScaledMMLinearKernel
      VLLM_SSM_CONV_STATE_LAYOUT: DS
      VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE: '1'
      DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS: '0'
    volumes:
    - /data/nemotron-ultra/model:/model:ro
    - /data/disagg/runtime/nemotron-ultra/dynamo/vllm/decode:/runtime
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '3'
