name: disagg
services:
  decode:
    image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0
    entrypoint:
    - python3
    - -c
    - "import os, sys\nfrom pathlib import Path\nfrom importlib.metadata import version\n\
      from packaging.version import Version\nrevision, backend, minimum, *command\
      \ = sys.argv[1:]\nmarker = Path('/model/DEPLOYED_REVISION')\nif not marker.exists()\
      \ or marker.read_text().strip() != revision:\n    raise SystemExit('Checkpoint\
      \ revision mismatch: verify /model/DEPLOYED_REVISION on BOTH nodes')\nif Version(version(backend))\
      \ < Version(minimum):\n    raise SystemExit('This model requires ' + backend\
      \ + ' >= ' + minimum + '; select a compatible complete runtime image')\nos.execvp(command[0],\
      \ command)\n"
    - 003f183a92fbe5b9a8325aaa8b2ae797c91dd90f
    - sglang
    - 0.5.16
    - python3
    - -m
    - dynamo.sglang
    - --model-path
    - /model
    - --served-model-name
    - Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
    - --tensor-parallel-size
    - '8'
    - --context-length
    - '32768'
    - --max-running-requests
    - '32'
    - --chunked-prefill-size
    - '8192'
    - --mem-fraction-static
    - '0.8'
    - --page-size
    - '64'
    - --kv-cache-dtype
    - auto
    - --disaggregation-mode
    - decode
    - --disaggregation-transfer-backend
    - nixl
    - --disaggregation-bootstrap-port
    - '8998'
    - --host
    - 0.0.0.0
    - --port
    - '30000'
    - --enable-metrics
    - --disable-piecewise-cuda-graph
    - --dyn-tool-call-parser
    - qwen3_coder
    - --kv-events-config
    - '{"publisher": "zmq", "topic": "kv-events", "endpoint": "tcp://*:5571"}'
    network_mode: host
    ipc: host
    user: '0'
    gpus: all
    devices:
    - /dev/infiniband:/dev/infiniband
    cap_add:
    - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    environment:
      HF_HOME: /runtime/hf
      HF_MODULES_CACHE: /runtime/hf_modules
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TRITON_CACHE_DIR: /runtime/triton
      XDG_CACHE_HOME: /runtime/cache
      TORCH_EXTENSIONS_DIR: /runtime/torch_extensions
      PYTHONHASHSEED: '0'
      UCX_NET_DEVICES: mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1
      UCX_TLS: rc_x,rc,cuda_copy,cuda_ipc
      UCX_RNDV_SCHEME: get_zcopy
      UCX_RNDV_THRESH: '0'
      NCCL_SOCKET_IFNAME: eth0
      GLOO_SOCKET_IFNAME: eth0
      NCCL_IB_DISABLE: '0'
      NIXL_LOG_LEVEL: INFO
      DYN_NAMESPACE: disagg
      DYN_DISCOVERY_BACKEND: etcd
      ETCD_ENDPOINTS: http://<B300_NODE_A_IP>:2379
      DYN_REQUEST_PLANE: tcp
      DYN_EVENT_PLANE: zmq
      DYN_TCP_RPC_HOST: <B300_NODE_B_IP>
      DYN_TCP_RESPONSE_STREAM_HOST: <B300_NODE_B_IP>
      DYN_EVENT_PLANE_HOST: <B300_NODE_B_IP>
      DYN_SYSTEM_PORT: '8081'
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
      SGLANG_DISAGGREGATION_NIXL_BACKEND_PARAMS: '{"ucx_devices": "mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1,mlx5_11:1"}'
    volumes:
    - /data/models/qwen-480b:/model:ro
    - /data/disagg/runtime/qwen-480b/dynamo/sglang/decode:/runtime
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: '3'
