<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" role="img" aria-label="Sequence diagram with four lanes: client, frontend and router, prefill worker, decode worker. The router picks workers, prefill computes the KV cache, decode reads the KV blocks over RDMA and streams tokens back.">
<title>Sequence diagram with four lanes: client, frontend and router, prefill worker, decode worker. The router picks workers, prefill computes the KV cache, decode reads the KV blocks over RDMA and streams tokens back.</title>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-size: 13.5px; fill: #475569; }
.h { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.lbl { font-size: 13px; font-weight: 600; }
.lbl-lg { font-size: 15px; font-weight: 700; }
.sub { font-size: 11.5px; fill: #475569; }
.small { font-size: 11px; fill: #475569; }
.tiny { font-size: 10px; fill: #475569; }
.note { font-size: 11.5px; fill: #475569; font-style: italic; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #475569; }
.edge { font-size: 11.5px; font-weight: 600; fill: #475569; }
.edge-kv { font-size: 12px; font-weight: 700; fill: #E11D48; }
.num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
</style>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="aE11D48" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker></defs>
<rect x="0.5" y="0.5" width="1359" height="799" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="36" y="46" class="title">Life of a request in disaggregated serving</text>
<text x="36" y="70" class="subtitle">vLLM + NIXL flow under Dynamo. Decode pulls the KV cache directly from prefill GPU memory.</text>
<rect x="50" y="96" width="240" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="170.0" y="120.0" class="lbl" text-anchor="middle" style="fill:#334155">Client</text>
<text x="170.0" y="136.0" class="sub" text-anchor="middle">application</text>
<line x1="170" y1="148" x2="170" y2="716" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="370" y="96" width="240" height="52" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
<text x="490.0" y="120.0" class="lbl" text-anchor="middle" style="fill:#4338CA">Frontend + router</text>
<text x="490.0" y="136.0" class="sub" text-anchor="middle">OpenAI API · KV-aware</text>
<line x1="490" y1="148" x2="490" y2="716" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="710" y="96" width="240" height="52" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.3"/>
<text x="830.0" y="120.0" class="lbl" text-anchor="middle" style="fill:#C2410C">Prefill worker</text>
<text x="830.0" y="136.0" class="sub" text-anchor="middle">GPU pool A</text>
<line x1="830" y1="148" x2="830" y2="716" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1050" y="96" width="240" height="52" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
<text x="1170.0" y="120.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">Decode worker</text>
<text x="1170.0" y="136.0" class="sub" text-anchor="middle">GPU pool B</text>
<line x1="1170" y1="148" x2="1170" y2="716" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="176,196 482,196" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="330.0" y="188" class="edge" text-anchor="middle">POST /v1/chat/completions</text>
<circle cx="192" cy="182" r="10" fill="#0F172A" stroke="none" stroke-width="1"/>
<text x="192" y="186" class="num" text-anchor="middle">1</text>
<rect x="482" y="214" width="16" height="46" rx="3" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
<text x="510" y="235.0" class="lbl" text-anchor="start" style="fill:#4338CA;font-size:12px">Tokenize · template · route</text>
<text x="510" y="251.0" class="sub" text-anchor="start">pick P and D by KV overlap and load</text>
<polyline points="496,300 822,300" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="660.0" y="292" class="edge" text-anchor="middle">prefill request (whole prompt)</text>
<circle cx="512" cy="286" r="10" fill="#0F172A" stroke="none" stroke-width="1"/>
<text x="512" y="290" class="num" text-anchor="middle">2</text>
<rect x="822" y="316" width="16" height="66" rx="3" fill="#FFF7ED" stroke="#F97316" stroke-width="1.3"/>
<text x="850" y="347.0" class="lbl" text-anchor="start" style="fill:#C2410C;font-size:12px">Compute KV for every prompt token</text>
<text x="850" y="363.0" class="sub" text-anchor="start">compute-bound · TTFT lives here</text>
<polyline points="824,420 498,420" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="660.0" y="412" class="edge" text-anchor="middle">first token + KV block handles</text>
<circle cx="512" cy="406" r="10" fill="#0F172A" stroke="none" stroke-width="1"/>
<text x="512" y="410" class="num" text-anchor="middle">3</text>
<polyline points="496,476 1162,476" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="830.0" y="468" class="edge" text-anchor="middle">decode request + handles</text>
<circle cx="512" cy="462" r="10" fill="#0F172A" stroke="none" stroke-width="1"/>
<text x="512" y="466" class="num" text-anchor="middle">4</text>
<polyline points="1164,532 838,532" fill="none" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aE11D48)"/>
<text x="1000.0" y="524" class="edge-kv" text-anchor="middle" style="fill:#E11D48">RDMA read of KV blocks · NIXL · GPUDirect</text>
<circle cx="852" cy="518" r="10" fill="#E11D48" stroke="none" stroke-width="1"/>
<text x="852" y="522" class="num" text-anchor="middle">5</text>
<rect x="1162" y="552" width="16" height="76" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
<text x="1150" y="588.0" class="lbl" text-anchor="end" style="fill:#1D4ED8;font-size:12px">Generate tokens</text>
<text x="1150" y="604.0" class="sub" text-anchor="end">one step per token · ITL lives here</text>
<polyline points="1164,672 178,672" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="670.0" y="664" class="edge" text-anchor="middle">stream tokens (SSE) via the frontend</text>
<circle cx="192" cy="658" r="10" fill="#0F172A" stroke="none" stroke-width="1"/>
<text x="192" y="662" class="num" text-anchor="middle">6</text>
<rect x="36" y="730" width="1288" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="56" y="752" class="lbl" text-anchor="start" style="font-size:12px">TTFT</text>
<text x="100" y="752" class="sub" text-anchor="start">= queueing + prefill (step 2) + KV transfer (step 5) + first decode step</text>
<text x="56" y="770" class="lbl" text-anchor="start" style="font-size:12px">ITL</text>
<text x="100" y="770" class="sub" text-anchor="start">= one decode step; other users’ prefills run on other GPUs and no longer stall it</text>
<text x="1304" y="761" class="note" text-anchor="end">SGLang: decode handshakes with prefill’s bootstrap server (:8998), prefill pushes KV</text>
</svg>
