<rect x="0.5" y="0.5" width="1359" height="799" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="36" y="46" class="title">Disaggregated serving is the microservices pattern for inference</text>
<text x="36" y="70" class="subtitle">Split a monolith by resource profile, scale each part for its own traffic. The difference: the hand-off is gigabytes.</text>
<text x="341" y="104" class="h" text-anchor="middle" style="fill:#475569">CLASSIC APPLICATION</text>
<text x="1019" y="104" class="h" text-anchor="middle" style="fill:#475569">LLM INFERENCE</text>
