<text x="1184" y="552" class="sub" text-anchor="middle">bandwidth-bound · 2 workers</text>
<polyline points="1019,468 1019,484 1184,484 1184,500" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polyline points="972,540 1066,540" fill="none" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aE11D48)"/>
<text x="1019" y="596" class="edge-kv" text-anchor="middle">KV cache · gigabytes</text>
<text x="1019" y="612" class="tiny" text-anchor="middle" style="fill:#E11D48">RDMA · NIXL</text>
<rect x="744" y="628" width="250" height="40" rx="10" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.3"/>
<text x="869.0" y="646.0" class="lbl" text-anchor="middle" style="fill:#7E22CE">etcd / InferencePool</text>
<text x="869.0" y="662.0" class="sub" text-anchor="middle">discovery</text>
<rect x="1044" y="628" width="250" height="40" rx="10" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.3"/>
<text x="1169.0" y="646.0" class="lbl" text-anchor="middle" style="fill:#7E22CE">Planner / autoscaler</text>
<text x="1169.0" y="662.0" class="sub" text-anchor="middle">scales each service</text>
<text x="680" y="540" class="title" text-anchor="middle" style="fill:#94A3B8">≈</text>
<rect x="36" y="708" width="1288" height="64" rx="12" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.2"/>
<text x="56" y="734" class="lbl" text-anchor="start" style="fill:#E11D48">What carries over:</text>
<text x="196" y="734" class="sub" text-anchor="start" style="fill:#0F172A">split by resource profile · scale each part for its own traffic · a gateway routes · a registry discovers · an autoscaler right-sizes.</text>
<text x="56" y="756" class="lbl" text-anchor="start" style="fill:#E11D48">What does not:</text>
<text x="196" y="756" class="sub" text-anchor="start" style="fill:#0F172A">services exchange kilobytes; prefill hands decode gigabytes of state per request, so the GPU fabric (RDMA, NVLink) becomes part of the architecture.</text>
</svg>
