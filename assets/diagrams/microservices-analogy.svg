<text x="341" y="596" class="edge" text-anchor="middle">JSON · kilobytes</text>
<text x="341" y="612" class="tiny" text-anchor="middle" style="fill:#475569">HTTP / gRPC</text>
<rect x="66" y="628" width="250" height="40" rx="10" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.3"/>
<text x="191.0" y="646.0" class="lbl" text-anchor="middle" style="fill:#7E22CE">Service registry</text>
<text x="191.0" y="662.0" class="sub" text-anchor="middle">discovery</text>
<rect x="366" y="628" width="250" height="40" rx="10" fill="#FAF5FF" stroke="#C084FC" stroke-width="1.3"/>
<text x="491.0" y="646.0" class="lbl" text-anchor="middle" style="fill:#7E22CE">Autoscaler (HPA)</text>
<text x="491.0" y="662.0" class="sub" text-anchor="middle">scales each service</text>
<rect x="919" y="428" width="200" height="40" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
<text x="1019.0" y="453.0" class="lbl" text-anchor="middle" style="fill:#4338CA">Frontend / router</text>
