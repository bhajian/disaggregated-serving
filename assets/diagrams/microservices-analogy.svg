<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" role="img" aria-label="Two by two comparison. A monolith maps to aggregated serving; microservices map to disaggregated serving. API gateway maps to the router, the service registry to etcd or the InferencePool, the autoscaler to the Planner. Unlike microservices, prefill hands decode gigabytes of KV cache over RDMA.">
<title>Two by two comparison. A monolith maps to aggregated serving; microservices map to disaggregated serving. API gateway maps to the router, the service registry to etcd or the InferencePool, the autoscaler to the Planner. Unlike microservices, prefill hands decode gigabytes of KV cache over RDMA.</title>
