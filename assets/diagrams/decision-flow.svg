<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" role="img" aria-label="Decision tree. If inputs are short and there is no strict tail-latency target, use aggregated replicas with KV-aware routing. Otherwise, if there is no RDMA or rack-scale NVLink, stay aggregated and fix the fabric. With the fabric, large MoE models use disaggregation with wide expert parallelism on rack-scale NVLink; other models use prefill/decode disaggregation over RDMA. Add KV tiers when prefix reuse exceeds GPU memory.">
<title>Decision tree. If inputs are short and there is no strict tail-latency target, use aggregated replicas with KV-aware routing. Otherwise, if there is no RDMA or rack-scale NVLink, stay aggregated and fix the fabric. With the fabric, large MoE models use disaggregation with wide expert parallelism on rack-scale NVLink; other models use prefill/decode disaggregation over RDMA. Add KV tiers when prefix reuse exceeds GPU memory.</title>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-size: 13.5px; fill: #475569; }
.h { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.lbl { font-size: 13px; font-weight: 600; }
.lbl-lg { font-size: 15px; font-weight: 700; }
.sub { font-size: 11.5px; fill: #475569; }
.small { font-size: 11px; fill: #475569; }
.tiny { font-size: 10px; fill: #475569; }
.note { font-size: 11.5px; fill: #475569; font-style: italic; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #475569; }
.edge { font-size: 11.5px; font-weight: 600; fill: #475569; }
.edge-kv { font-size: 12px; font-weight: 700; fill: #E11D48; }
.num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
</style>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect x="0.5" y="0.5" width="1359" height="799" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="36" y="46" class="title">Choosing a serving design</text>
<text x="36" y="70" class="subtitle">Decide the topology from traffic, SLOs and fabric first; then pick the control plane and engine.</text>
<rect x="180" y="96" width="300" height="48" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="330.0" y="118.0" class="lbl" text-anchor="middle" style="fill:#334155">Start from the workload</text>
<text x="330.0" y="134.0" class="sub" text-anchor="middle">model · traffic shape · SLOs · hardware</text>
<polyline points="330,144 330,166" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polygon points="330,178.0 480.0,236 330,294.0 180.0,236" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
<text x="330" y="230" class="lbl" text-anchor="middle" style="font-size:12.5px">Long inputs, or a strict</text>
<text x="330" y="246" class="lbl" text-anchor="middle" style="font-size:12.5px">p99 ITL target?</text>
<polyline points="480,236 596,236" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="498" y="228" class="edge" text-anchor="start">no</text>
<rect x="600" y="206" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="740.0" y="234.0" class="lbl" text-anchor="middle" style="fill:#0F172A">Aggregated replicas</text>
<text x="740.0" y="250.0" class="sub" text-anchor="middle">KV-aware routing · deploy 01</text>
<polygon points="330,328.0 480.0,386 330,444.0 180.0,386" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
<text x="330" y="380" class="lbl" text-anchor="middle" style="font-size:12.5px">GPUDirect RDMA or</text>
<text x="330" y="396" class="lbl" text-anchor="middle" style="font-size:12.5px">rack-scale NVLink?</text>
<polyline points="480,386 596,386" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="498" y="378" class="edge" text-anchor="start">no</text>
<rect x="600" y="356" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="740.0" y="384.0" class="lbl" text-anchor="middle" style="fill:#0F172A">Stay aggregated</text>
<text x="740.0" y="400.0" class="sub" text-anchor="middle">fix the fabric before splitting</text>
<polygon points="330,478.0 480.0,536 330,594.0 180.0,536" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5"/>
<text x="330" y="530" class="lbl" text-anchor="middle" style="font-size:12.5px">Large MoE that gains</text>
<text x="330" y="546" class="lbl" text-anchor="middle" style="font-size:12.5px">from wide EP?</text>
<polyline points="480,536 596,536" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="498" y="528" class="edge" text-anchor="start">yes</text>
<rect x="600" y="506" width="280" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
<text x="740.0" y="534.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">P/D + wide-EP decode</text>
<text x="740.0" y="550.0" class="sub" text-anchor="middle">rack-scale NVLink (NVL72)</text>
<polyline points="330,294 330,326" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="340" y="316" class="edge" text-anchor="start">yes</text>
<polyline points="330,444 330,476" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="340" y="466" class="edge" text-anchor="start">yes</text>
<polyline points="330,594 330,626" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="340" y="616" class="edge" text-anchor="start">no</text>
<rect x="180" y="628" width="300" height="60" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.3"/>
<text x="330.0" y="656.0" class="lbl" text-anchor="middle" style="fill:#C2410C">P/D disaggregation</text>
<text x="330.0" y="672.0" class="sub" text-anchor="middle">over GPUDirect RDMA · deploy 02 / 03 / 04</text>
<rect x="36" y="716" width="844" height="56" rx="12" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.3"/>
<text x="56" y="740" class="lbl" text-anchor="start" style="fill:#0E7490;font-size:12.5px">For every outcome:</text>
<text x="196" y="740" class="sub" text-anchor="start" style="fill:#0F172A">if reusable prefixes exceed GPU memory, add KV tiers</text>
<text x="196" y="758" class="sub" text-anchor="start">host DRAM → local NVMe with GPUDirect Storage → shared storage  (chapter 08)</text>
<rect x="912" y="96" width="412" height="676" rx="14" fill="#FCFCFD" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="932" y="124" class="h" text-anchor="start" style="fill:#475569">THEN PICK THE SOFTWARE</text>
<text x="932" y="156" class="lbl-lg" text-anchor="start" style="fill:#4338CA">Serving control plane</text>
<rect x="932" y="172" width="372" height="74" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
<text x="1118.0" y="200.0" class="lbl" text-anchor="middle" style="fill:#4338CA">NVIDIA Dynamo</text>
<text x="1118.0" y="216.0" class="sub" text-anchor="middle">Docker or Kubernetes · all three engines</text>
<text x="1118.0" y="230.0" class="sub" text-anchor="middle">Planner (P/D autoscaling) · KVBM tiers</text>
<rect x="932" y="258" width="372" height="74" rx="10" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.3"/>
<text x="1118.0" y="286.0" class="lbl" text-anchor="middle" style="fill:#4338CA">llm-d</text>
<text x="1118.0" y="302.0" class="sub" text-anchor="middle">Kubernetes-native · Gateway API</text>
<text x="1118.0" y="316.0" class="sub" text-anchor="middle">pluggable endpoint picker · LMCache</text>
<text x="932" y="376" class="lbl-lg" text-anchor="start" style="fill:#1D4ED8">Inference engine</text>
<rect x="932" y="392" width="372" height="74" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
<text x="1118.0" y="420.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">TensorRT-LLM</text>
<text x="1118.0" y="436.0" class="sub" text-anchor="middle">peak performance on NVIDIA GPUs</text>
<text x="1118.0" y="450.0" class="sub" text-anchor="middle">for supported models</text>
<rect x="932" y="478" width="372" height="74" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
<text x="1118.0" y="506.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">vLLM</text>
<text x="1118.0" y="522.0" class="sub" text-anchor="middle">broadest model and hardware coverage</text>
<text x="1118.0" y="536.0" class="sub" text-anchor="middle">primary engine for llm-d</text>
<rect x="932" y="564" width="372" height="74" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.3"/>
<text x="1118.0" y="592.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">SGLang</text>
<text x="1118.0" y="608.0" class="sub" text-anchor="middle">prefix-heavy and agentic workloads</text>
<text x="1118.0" y="622.0" class="sub" text-anchor="middle">large-MoE P/D + wide-EP recipes</text>
<text x="932" y="670" class="sub" text-anchor="start" style="fill:#0F172A">Validate every choice on your hardware:</text>
<text x="932" y="688" class="sub" text-anchor="start">same dataset, same SLOs, aggregated baseline first</text>
<text x="932" y="718" class="mono" text-anchor="start">benchmarks/ · deployments/</text>
</svg>
