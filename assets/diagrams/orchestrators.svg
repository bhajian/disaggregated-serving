<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" width="1360" height="800" role="img" aria-label="Left: NVIDIA Dynamo. Requests go to a frontend with a KV router that dispatches prefill and decode to workers; etcd discovery, the Planner and the KV block manager support it. Right: llm-d. Requests go through an Envoy gateway that asks the endpoint picker for a pod; a routing sidecar on the decode pod coordinates prefill. Kubernetes provides discovery through the InferencePool.">
<title>Left: NVIDIA Dynamo. Requests go to a frontend with a KV router that dispatches prefill and decode to workers; etcd discovery, the Planner and the KV block manager support it. Right: llm-d. Requests go through an Envoy gateway that asks the endpoint picker for a pod; a routing sidecar on the decode pod coordinates prefill. Kubernetes provides discovery through the InferencePool.</title>
