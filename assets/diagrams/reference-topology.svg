<text x="1186" y="520" class="mono" text-anchor="start">mlx5_4 … mlx5_11</text>
<line x1="36" y1="540" x2="1324" y2="540" stroke="#475569" stroke-width="3"/>
<text x="36" y="560" class="h" text-anchor="start" style="fill:#334155">CONTROL NETWORK</text>
