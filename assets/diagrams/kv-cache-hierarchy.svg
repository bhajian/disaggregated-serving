<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 720" width="1360" height="720" role="img" aria-label="Left: four KV tiers from GPU memory to shared storage, capacity growing and bandwidth falling, with offload and onboard arrows. Right: without GPUDirect Storage, NVMe data goes through a CPU bounce buffer before reaching the GPU; with it, the NVMe drive writes directly into GPU memory through the PCIe switch.">
<title>Left: four KV tiers from GPU memory to shared storage, capacity growing and bandwidth falling, with offload and onboard arrows. Right: without GPUDirect Storage, NVMe data goes through a CPU bounce buffer before reaching the GPU; with it, the NVMe drive writes directly into GPU memory through the PCIe switch.</title>
<style>
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.subtitle { font-size: 13.5px; fill: #475569; }
.h { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.lbl { font-size: 13px; font-weight: 600; }
.lbl-lg { font-size: 15px; font-weight: 700; }
.sub { font-size: 11.5px; fill: #475569; }
.small { font-size: 11px; fill: #475569; }
.tiny { font-size: 10px; fill: #475569; }
.note { font-size: 11.5px; fill: #475569; font-style: italic; }
.mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #475569; }
.edge { font-size: 11.5px; font-weight: 600; fill: #475569; }
.edge-kv { font-size: 12px; font-weight: 700; fill: #E11D48; }
.num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
</style>
<defs><marker id="a475569" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="aE11D48" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E11D48"/></marker></defs>
<rect x="0.5" y="0.5" width="1359" height="719" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="36" y="46" class="title">KV cache as virtual memory</text>
<text x="36" y="70" class="subtitle">Evict down the hierarchy instead of discarding; reload instead of recomputing. GPUDirect Storage removes the CPU detour.</text>
<rect x="246.0" y="110" width="300" height="84" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
<text x="396" y="140" class="lbl-lg" text-anchor="middle" style="fill:#1D4ED8">G1 · GPU HBM</text>
<text x="396" y="160" class="sub" text-anchor="middle" style="fill:#0F172A">active sequences</text>
<text x="396" y="178" class="small" text-anchor="middle">smallest · fastest · per worker</text>
<polyline points="336,196 336,226" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polyline points="456,226 456,196" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="326" y="216" class="tiny" text-anchor="end">offload on eviction</text>
<text x="466" y="216" class="tiny" text-anchor="start">onboard on cache hit</text>
<rect x="196.0" y="230" width="400" height="84" rx="12" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.4"/>
<text x="396" y="260" class="lbl-lg" text-anchor="middle" style="fill:#15803D">G2 · Host DRAM</text>
<text x="396" y="280" class="sub" text-anchor="middle" style="fill:#0F172A">hot, recently evicted prefixes</text>
<text x="396" y="298" class="small" text-anchor="middle">larger · PCIe / C2C · per node</text>
<polyline points="336,316 336,346" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polyline points="456,346 456,316" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="326" y="336" class="tiny" text-anchor="end">offload on eviction</text>
<text x="466" y="336" class="tiny" text-anchor="start">onboard on cache hit</text>
<rect x="146.0" y="350" width="500" height="84" rx="12" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.4"/>
<text x="396" y="380" class="lbl-lg" text-anchor="middle" style="fill:#0E7490">G3 · Local NVMe</text>
<text x="396" y="400" class="sub" text-anchor="middle" style="fill:#0F172A">warm sessions and documents</text>
<text x="396" y="418" class="small" text-anchor="middle">10× capacity · GPUDirect Storage · per node</text>
<polyline points="336,436 336,466" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polyline points="456,466 456,436" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="326" y="456" class="tiny" text-anchor="end">offload on eviction</text>
<text x="466" y="456" class="tiny" text-anchor="start">onboard on cache hit</text>
<rect x="96.0" y="470" width="600" height="84" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4"/>
<text x="396" y="500" class="lbl-lg" text-anchor="middle" style="fill:#1E293B">G4 · Shared storage</text>
<text x="396" y="520" class="sub" text-anchor="middle" style="fill:#0F172A">prefixes reusable by any worker</text>
<text x="396" y="538" class="small" text-anchor="middle">largest · over RDMA · cluster-wide</text>
<text x="396" y="606" class="lbl" text-anchor="middle" style="font-size:12px">Reuse wins when reload time &lt; recompute (prefill) time.</text>
<text x="396" y="624" class="sub" text-anchor="middle">The router must see all tiers to route to the worker holding the longest prefix.</text>
<rect x="800" y="104" width="524" height="276" rx="14" fill="#FCFCFD" stroke="#E2E8F0" stroke-width="1.2"/>
<text x="820" y="132" class="lbl-lg" text-anchor="start" style="fill:#0F172A">Without GPUDirect Storage</text>
<rect x="982" y="154" width="160" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
<text x="1062.0" y="174.0" class="lbl" text-anchor="middle" style="fill:#0F172A">CPU · DRAM</text>
<text x="1062.0" y="190.0" class="sub" text-anchor="middle">bounce buffer</text>
<rect x="982" y="236" width="160" height="40" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.3"/>
<text x="1062.0" y="261.0" class="lbl" text-anchor="middle" style="fill:#1E293B">PCIe switch</text>
<rect x="830" y="310" width="150" height="46" rx="10" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.3"/>
<text x="905.0" y="331.0" class="lbl" text-anchor="middle" style="fill:#0E7490">NVMe drive</text>
<text x="905.0" y="347.0" class="sub" text-anchor="middle">KV blocks</text>
<rect x="1144" y="310" width="150" height="46" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
<text x="1219.0" y="331.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">GPU HBM</text>
<text x="1219.0" y="347.0" class="sub" text-anchor="middle">decode / prefill</text>
<line x1="1062" y1="198" x2="1062" y2="236" stroke="#CBD5E1" stroke-width="1.4"/>
<polyline points="905,310 905,256 982,256" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<polyline points="1040,236 1040,200" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="1032" y="222" class="edge" text-anchor="end">① DMA to host</text>
<polyline points="1084,200 1084,236" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="1092" y="222" class="edge" text-anchor="start">② copy to GPU</text>
<polyline points="1142,256 1219,256 1219,308" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a475569)"/>
<text x="1062" y="300" class="tiny" text-anchor="middle">2 transfers · CPU cycles · host bandwidth</text>
<rect x="800" y="404" width="524" height="276" rx="14" fill="#FCFCFD" stroke="#E11D48" stroke-width="1.4"/>
<text x="820" y="432" class="lbl-lg" text-anchor="start" style="fill:#E11D48">With GPUDirect Storage</text>
<rect x="982" y="454" width="160" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="1062.0" y="474.0" class="lbl" text-anchor="middle" style="fill:#0F172A">CPU · DRAM</text>
<text x="1062.0" y="490.0" class="sub" text-anchor="middle">not involved</text>
<rect x="982" y="536" width="160" height="40" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.3"/>
<text x="1062.0" y="561.0" class="lbl" text-anchor="middle" style="fill:#1E293B">PCIe switch</text>
<rect x="830" y="610" width="150" height="46" rx="10" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.3"/>
<text x="905.0" y="631.0" class="lbl" text-anchor="middle" style="fill:#0E7490">NVMe drive</text>
<text x="905.0" y="647.0" class="sub" text-anchor="middle">KV blocks</text>
<rect x="1144" y="610" width="150" height="46" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.3"/>
<text x="1219.0" y="631.0" class="lbl" text-anchor="middle" style="fill:#1D4ED8">GPU HBM</text>
<text x="1219.0" y="647.0" class="sub" text-anchor="middle">decode / prefill</text>
<line x1="1062" y1="498" x2="1062" y2="536" stroke="#CBD5E1" stroke-width="1.4"/>
<polyline points="905,610 905,556 982,556" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aE11D48)"/>
<polyline points="1142,556 1219,556 1219,608" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aE11D48)"/>
<text x="1062" y="600" class="tiny" text-anchor="middle" style="fill:#E11D48;font-weight:700">1 DMA straight into GPU memory (cuFile / NIXL GDS)</text>
</svg>
