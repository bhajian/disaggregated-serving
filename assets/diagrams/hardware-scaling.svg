<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 740" width="1360" height="740" role="img" aria-label="Left: two 8-GPU servers, each its own NVLink domain, connected by an InfiniBand or Ethernet fabric; KV moves between servers over RDMA. Right: a rack-scale NVLink domain of 72 GPUs where prefill and decode GPUs exchange KV over NVLink and wide expert parallelism spans the rack.">
