<line x1="56" y1="542" x2="646" y2="542" stroke="#E2E8F0" stroke-width="1"/>
<text x="56" y="560" class="lbl" text-anchor="start" style="font-size:12px">Scaling unit</text>
<text x="176" y="560" class="sub" text-anchor="start">a whole replica (prefill + decode together)</text>
<line x1="56" y1="572" x2="646" y2="572" stroke="#E2E8F0" stroke-width="1"/>
<text x="56" y="590" class="lbl" text-anchor="start" style="font-size:12px">Between nodes</text>
<text x="176" y="590" class="sub" text-anchor="start">no KV movement, no RDMA needed</text>
<line x1="56" y1="602" x2="646" y2="602" stroke="#E2E8F0" stroke-width="1"/>
<text x="56" y="620" class="lbl" text-anchor="start" style="font-size:12px">Weak spot</text>
<text x="176" y="620" class="sub" text-anchor="start">long prompts stall other users’ tokens (ITL spikes)</text>
