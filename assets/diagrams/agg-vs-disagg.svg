<rect x="0.5" y="0.5" width="1359" height="719" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="36" y="46" class="title">Aggregated vs disaggregated serving</text>
<text x="36" y="70" class="subtitle">Same GPUs, same model. Disaggregation adds one edge, the KV-cache transfer, and removes phase interference.</text>
<rect x="36" y="96" width="630" height="600" rx="14" fill="#FCFCFD" stroke="#E2E8F0" stroke-width="1.2"/>
